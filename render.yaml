services:
  - type: web
    name: typeblaze
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 3 --bind 0.0.0.0:$PORT backend.app:app
    healthCheckPath: /api/health
    envVars:
      - key: TYPEBLAZE_SECRET_KEY
        generateValue: true
